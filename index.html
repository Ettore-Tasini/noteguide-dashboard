<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- Aggiunta alla schermata Home dell'iPhone si apre come un'app, e il login resta (Matteo, 8/11) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gestionale">
  <title>NoteGuide Gestionale</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%236250d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="stile.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="testata">
    <div class="marchio">NoteGuide <span>Gestionale</span></div>
    <div id="stato-dati" class="pillola" role="status"></div>
  </header>
  <nav id="schede" class="schede" aria-label="Sezioni"></nav>
  <main id="contenuto" tabindex="-1"></main>

  <section id="accesso" class="accesso" hidden>
    <h1>Accesso</h1>
    <p>Entra con email e password. Solo Ettore e Matteo hanno un account.</p>
    <form id="modulo-accesso">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Entra</button>
      <button type="button" id="manda-link" class="secondario">Prima volta o password dimenticata: mandami un link per email</button>
    </form>
    <p id="esito-accesso" role="status"></p>
  </section>
</body>
</html>
